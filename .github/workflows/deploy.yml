name: Deploy to PythonAnywhere

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger PythonAnywhere deploy
        env:
          DEPLOY_URL: ${{ secrets.PAW_DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.PAW_DEPLOY_TOKEN }}
        run: |
          test -n "$DEPLOY_URL"
          test -n "$DEPLOY_TOKEN"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 5 \
            -X POST "$DEPLOY_URL" \
            -H "X-Deploy-Token: $DEPLOY_TOKEN"

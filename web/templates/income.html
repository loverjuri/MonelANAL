{% extends "base.html" %}
{% block title %}Доход — MonelANAL{% endblock %}
{% block content %}
<div class="page-header">
  <a href="{{ url_for('web.more') }}" class="btn btn-back" aria-label="Назад">←</a>
  <h1>Добавить доход</h1>
</div>
<p class="muted">Копилка ИП: {{ '%.2f'|format(ip_savings or 0) }} руб. (1% от доходов ИП)</p>
<form method="post">
  <div class="form-group">
    <label>Счёт</label>
    <select name="account_id"><option value="">Без привязки к счёту</option>{% for a in accounts or [] %}<option value="{{ a.id }}">{{ a.name }}</option>{% endfor %}</select>
  </div>
  <div class="form-group">
    <label>Источник</label>
    <select name="source"><option value="Вторая работа">Вторая работа</option><option value="ИП">ИП</option>{% for s in income_sources or [] %}<option value="{{ s.name }}">{{ s.name }}</option>{% endfor %}</select>
  </div>
  <div class="form-group">
    <label>Тег</label>
    <input type="text" name="income_tag" placeholder="Заказ, доплата, продажа">
  </div>
  <div class="form-group">
    <label>Сумма (руб.)</label>
    <input type="text" name="amount" placeholder="1000" required inputmode="decimal">
  </div>
  <div class="form-group">
    <label>Дата</label>
    <input type="date" name="date" value="{{ today or request.values.date or '' }}">
  </div>
  <div class="form-group">
    <label>Комментарий</label>
    <input type="text" name="comment" placeholder="Опционально">
  </div>
  <button type="submit" class="btn">Записать</button>
</form>
{% endblock %}
